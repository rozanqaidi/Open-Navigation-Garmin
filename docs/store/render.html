const meY = 124 * K;                      // our position on screen
const c = document.getElementById('c'), x = c.getContext('2d');
x.fillStyle = '#000'; x.fillRect(0, 0, S, S);
x.save(); x.beginPath(); x.arc(S/2, S/2, S/2 - 2, 0, Math.PI*2); x.clip();
x.lineCap = 'round'; x.lineJoin = 'round';

// ---------- route geometry ----------
const R = D.route, cum = [0];
for (let i = 1; i < R.length; i++) cum.push(cum[i-1] + Math.hypot(R[i][0]-R[i-1][0], R[i][1]-R[i-1][1]));
const TOTAL = cum[cum.length-1];
function at(a) { for (let i = 1; i < R.length; i++) if (cum[i] >= a) { const t = (a-cum[i-1])/((cum[i]-cum[i-1])||1); return [R[i-1][0]+t*(R[i][0]-R[i-1][0]), R[i-1][1]+t*(R[i][1]-R[i-1][1]), i]; } return [...R[R.length-1], R.length-1]; }
const brg = a => { const p = at(a), n = at(a+10); return Math.atan2(n[0]-p[0], n[1]-p[1]); };
const TURNS = [];       // [along, degrees (+ = right)]
for (let a = 20; a < TOTAL - 20; a += 4) {
  const d = ((brg(a) - brg(a-10)) * 180/Math.PI + 540) % 360 - 180;
  if (Math.abs(d) >= 40) { const L = TURNS[TURNS.length-1]; if (L && a - L[0] < 20) { if (Math.abs(d) > Math.abs(L[1])) { L[0] = a; L[1] = d; } } else TURNS.push([a, d]); }
}

// ---------- projection (heading-up, like OpenNavGView.project) ----------
let ME = [0, 0], HEAD = 0;
function toS(p) { const dx = p[0]-ME[0], dy = p[1]-ME[1], ca = Math.cos(HEAD), sa = Math.sin(HEAD);
  return [S/2 + (dx*ca - dy*sa)/MPP, meY - (dx*sa + dy*ca)/MPP]; }
function poly(pts, col, w, dash) { x.beginPath(); pts.forEach((p, i) => { const s = toS(p); i ? x.lineTo(s[0], s[1]) : x.moveTo(s[0], s[1]); });
  x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash || []); x.stroke(); x.setLineDash([]); }
function streets() { for (const r of D.roads) if (r.c === 0) poly(r.p, ALLEY[0], ALLEY[1]);
                     for (const r of D.roads) if (r.c === 1) poly(r.p, ROAD[0], ROAD[1]); }
function routeLine(along) { const m = at(along); const done = R.slice(0, m[2]); done.push(m);
  poly(done, DONE, 10); poly([m, ...R.slice(m[2])], BLUE, 10); }

// ---------- text and icons (same as before) ----------
function halo(text, px, cx, cy, color, align) {
  x.font = `600 ${px}px -apple-system, Helvetica, Arial, sans-serif`;
  x.textAlign = align || 'center'; x.textBaseline = 'middle';
  x.lineWidth = Math.max(2, px * 0.16); x.strokeStyle = '#000'; x.lineJoin = 'round';
  x.strokeText(text, cx, cy); x.fillStyle = color; x.fillText(text, cx, cy);
}
function you(cx, tipY) {
  x.beginPath(); x.moveTo(cx, tipY); x.lineTo(cx - 12*K, tipY + 19*K); x.lineTo(cx, tipY + 12*K); x.lineTo(cx + 12*K, tipY + 19*K); x.closePath();
  x.lineWidth = 3; x.strokeStyle = '#000'; x.stroke(); x.fillStyle = '#fff'; x.fill();
}
const ICON = {
  right: ['M5 27 L5 14 Q5 7 12 7 L15 7', 'M14 0 L24 7 L14 14 Z', false],
  left: ['M5 27 L5 14 Q5 7 12 7 L15 7', 'M14 0 L24 7 L14 14 Z', true],
  back: ['M19 27 L19 14 Q19 7 12 7 L9 7', 'M10 0 L0 7 L10 14 Z', false]
};
function icon(kind, ox, oy, color) {
  x.save(); x.translate(ox, oy);
  if (ICON[kind][2]) { x.translate(24*K, 0); x.scale(-1, 1); }
  x.scale(K, K); x.lineCap = 'round'; x.lineJoin = 'round';
  const stem = new Path2D(ICON[kind][0]), head = new Path2D(ICON[kind][1]);
  x.strokeStyle = '#000'; x.lineWidth = 7.5; x.stroke(stem); x.lineWidth = 3; x.stroke(head);
  x.strokeStyle = color; x.lineWidth = 5; x.stroke(stem); x.fillStyle = color; x.fill(head);
  x.restore();
}
function header(kind, text, frac, color) {
  const px = 20*K; x.font = `600 ${px}px -apple-system, Helvetica, Arial, sans-serif`;
  const tw = x.measureText(text).width, iw = 24*K, gap = 7*K, total = iw + gap + tw, x0 = S/2 - total/2, cy = 36*K;
  icon(kind, x0, cy - 14*K, color || '#fff');
  halo(text, px, x0 + iw + gap, cy, color || '#fff', 'left');
  if (frac === null) return total;
  const bw = Math.max(total, 70*K), bx = S/2 - bw/2, by = cy + 20*K, bh = 4*K;
  const rr = (X, Y, W, H, col) => { x.fillStyle = col; x.beginPath(); x.roundRect(X, Y, W, H, H/2); x.fill(); };
  rr(bx - 2, by - 2, bw + 4, bh + 4, '#000'); rr(bx, by, bw, bh, '#333'); if (frac > 0) rr(bx, by, Math.max(bh, bw*frac), bh, YEL);
  return total;
}
// North indicator (Draw.north): red half = north, letter U just outside the ring; turns with the map.
function north() {
  const cx = S*0.82, cy = S*0.36, r = 11*K, ang = -HEAD;
  x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fillStyle = '#000'; x.fill(); x.lineWidth = 1.2*K; x.strokeStyle = '#777'; x.stroke();
  x.save(); x.translate(cx, cy); x.rotate(ang);
  x.beginPath(); x.moveTo(0, -8*K); x.lineTo(3.2*K, 0); x.lineTo(-3.2*K, 0); x.closePath(); x.fillStyle = RED; x.fill();
  x.beginPath(); x.moveTo(0, 8*K); x.lineTo(3.2*K, 0); x.lineTo(-3.2*K, 0); x.closePath(); x.fillStyle = '#bbb'; x.fill();
  x.restore();
  const lx = cx + Math.sin(ang)*(r + 6.5*K), ly = cy - Math.cos(ang)*(r + 6.5*K);
  const U = [[-2.3,-3.3],[-2.3,1.6],[-1.2,3.3],[1.2,3.3],[2.3,1.6],[2.3,-3.3]];
  for (const [col, w] of [['#000', 3.2*K], ['#fff', 1.3*K]]) {
    x.beginPath(); U.forEach((p, i) => i ? x.lineTo(lx + p[0]*K, ly + p[1]*K) : x.moveTo(lx + p[0]*K, ly + p[1]*K));
    x.strokeStyle = col; x.lineWidth = w; x.stroke();
  }
}
const km = a => ((TOTAL - a) / 1000).toFixed(1) + ' km lagi';
const foot = t => halo(t, 11*K, S/2, 172*K, '#bbb');
const round5 = m => Math.max(5, Math.round(m / 5) * 5);

// Navigation screen at `ahead` metres before turn number `ti`.
function nav(ti, ahead) {
  const t = TURNS[ti], along = t[0] - ahead;
  ME = at(along); HEAD = brg(along - 15);
  streets(); routeLine(along); you(S/2, meY);
  header(t[1] > 0 ? 'right' : 'left', round5(ahead) + ' m', Math.min(1, Math.max(0, 1 - ahead/300)));
  north();
  foot(km(along));
}

const s = new URLSearchParams(location.search).get('s');
if (s === 'approach') {
  nav(D.scenes.approach, 220);
} else if (s === 'turn') {
  nav(D.scenes.turn, 20);
} else if (s === 'off') {
  const o = D.scenes.off;            // {along, me, rejoin, trail, head}: metres east/north
  ME = o.me; HEAD = o.head;
  streets(); routeLine(o.along);
  // our trail since leaving the route (green dots) and the way back (red dashes + dot)
  poly(o.trail, GREEN, 3*K, [1, 5*K]);
  poly([o.me, o.rejoin], RED, 3*K, [6*K, 4*K]);
  const r = toS(o.rejoin); x.beginPath(); x.arc(r[0], r[1], 6*K, 0, 7); x.fillStyle = '#000'; x.fill();
  x.beginPath(); x.arc(r[0], r[1], 5*K, 0, 7); x.fillStyle = RED; x.fill();
  you(S/2, meY);
  const w = header('back', round5(Math.hypot(o.rejoin[0]-o.me[0], o.rejoin[1]-o.me[1])) + ' m', null, RED);
  north();
  foot(km(o.along));
} else if (s === 'ready' || s === 'ready-dest') {
  // ready = saved loop (Monas), ready-dest = saved point-to-point route to a destination (Malioboro)
  const dest = s === 'ready-dest', PTS = dest ? R : LOOP;
  halo('Rute siap', 14*K, S/2, 40*K, GREEN);
  // whole route north-up, fitted in a box like drawMiniRoute (the start point is a white dot)
  let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
  for (const p of PTS) { mnx = Math.min(mnx, p[0]); mxx = Math.max(mxx, p[0]); mny = Math.min(mny, p[1]); mxy = Math.max(mxy, p[1]); }
  const size = S * 0.36, k = size / Math.max(mxx - mnx, mxy - mny), cx = S/2, cy = S * 0.45;
  const P = p => [cx + (p[0] - (mnx+mxx)/2) * k, cy - (p[1] - (mny+mxy)/2) * k];
  x.beginPath(); PTS.forEach((p, i) => { const q = P(p); i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1]); });
  x.strokeStyle = BLUE; x.lineWidth = 6; x.stroke();
  const a = P(PTS[0]); x.beginPath(); x.arc(a[0], a[1], 6, 0, 7); x.fillStyle = '#fff'; x.fill();
  let len = 0; for (let i = 1; i < PTS.length; i++) len += Math.hypot(PTS[i][0]-PTS[i-1][0], PTS[i][1]-PTS[i-1][1]);
  halo(dest ? 'Malioboro Pagi' : 'Loop Monas 10K', 14*K, S/2, S * 0.70, '#fff');
  halo((len/1000).toFixed(1) + ' km · tap untuk ganti', 10*K, S/2, S * 0.80, '#bbb');
  halo('Peta siap ✓', 10*K, S/2, S * 0.89, GREEN);
}
x.restore();
</script></body></html>
