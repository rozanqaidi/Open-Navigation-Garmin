}
function picker(names, active) {
  line(H*0.17, s('ChooseRoute'), 'SMALL', '#bbbbbb');
  const rows = names.length + 1, step = Math.min(H*0.61/rows, H*0.17), top = H*0.575 - step*(rows-1)/2;
  for (let i = 0; i <= names.length; i++) {
    const y = top + i*step;
    if (i < names.length && i === active) rrect(W*0.18, y - step*0.42, W*0.64, step*0.84, step*0.25, '#16324f');
    line(y, i < names.length ? names[i] : s('ArrowToStart'), 'SMALL', '#fff');
  }
}

// ---------- off-route trail (Navigator) ----------
// Fixes once per second (~3 m/s walk). While <=10 m (LEAVE_M) from the line the fix's projection is the
// leave point; at the first fix >10 m the trail restarts as [leave point] and every fix is added
// (>=5 m apart), also during the 10 s before the alarm. Progress (grey/blue split) follows the last
// fix that was within 40 m.
function offTrail() {
  const o = D.scenes.off, path = o.trail.concat([o.me]), fixes = [];
  for (let i = 1; i < path.length; i++) { const a = path[i-1], b = path[i], L = Math.hypot(b[0]-a[0], b[1]-a[1]);
    for (let t = 0; t < L; t += 3) fixes.push([a[0] + (b[0]-a[0])*t/L, a[1] + (b[1]-a[1])*t/L]); }
  fixes.push(o.me);
  let leave = null, snap = null, trail = null;
  for (const f of fixes) {
    const nb = nearest(MALIO, f, 0, MALIO.n - 2);
    if (trail === null) {
      if (nb[1] <= 40) snap = nb;
      if (nb[1] <= 10) leave = nb; else trail = [leave[2], f];
    } else { const l = trail[trail.length-1]; if (Math.hypot(f[0]-l[0], f[1]-l[1]) >= 5) trail.push(f); }
    if (trail !== null && nb[1] <= 40 && snap !== null) snap = nb;
  }
  const along = MALIO.cum[snap[0]] + Math.hypot(snap[2][0]-MALIO.P[snap[0]][0], snap[2][1]-MALIO.P[snap[0]][1]);
  LOG.trail = {points: trail.length, leave: leave[2].map(Math.round), snap: snap[2].map(Math.round), along: Math.round(along),
               firstGap: Math.round(Math.hypot(trail[1][0]-trail[0][0], trail[1][1]-trail[0][1]))};
  return {trail: trail.slice(-120), snap: snap[2], along};
}
function turnAlong(r, type, minAlong) { for (let t = 0; t < r.turnAlong.length; t++) if (r.turnType[t] === type && r.turnAlong[t] > (minAlong || 0)) return r.turnAlong[t]; return null; }

// ---------- scenes ----------
const T = MALIO.turnAlong;
LOG.turns = MALIO.turnAlong.map((a, i) => [Math.round(a), MALIO.turnType[i]]);
LOG.total = [MALIO.total, MONAS.total];
const SC = {
  'ready-loop': () => ready(MONAS, 'ready'),
  'ready-dest': () => ready(MALIO, 'ready'),
  'ready-dest-loading': () => ready(MALIO, 'loading'),
  'ready-wait-phone': () => ready(MALIO, 'wait'),
  'ready-map-full': () => ready(MONAS, 'full'),
  'ready-no-map': () => ready(MONAS, 'none'),
  'straight': () => { const t = +Q.get('t'); navScreen({r: MALIO, along: T[t] - (+Q.get('d') || 640)}); },
  'approach': () => { const t = +Q.get('t'); navScreen({r: MALIO, along: T[t] - (+Q.get('d') || 220)}); },
  'turn-now': () => { const t = +Q.get('t'); navScreen({r: MALIO, along: T[t] - (+Q.get('d') || 15)}); },
  'uturn': () => { const a = turnAlong(MONAS, 3, +Q.get('min') || 0); navScreen({r: MONAS, along: a - (+Q.get('d') || 90), map: false}); },
  'off': () => { const o = D.scenes.off, t = offTrail(); navScreen({r: MALIO, along: t.along, head: o.head, off: {me: o.me, trail: t.trail, snap: t.snap}}); },
  'back': () => { navScreen({r: MALIO, along: +Q.get('a') || 742, back: true}); },
  'finish': () => navScreen({r: MALIO, along: MALIO.total - (+Q.get('d') || 180)}),
  'arrived': () => arrived(MALIO, 2, 2930),
  'bike': () => { const t = +Q.get('t'); navScreen({r: MALIO, along: T[t] - (+Q.get('d') || 260), mode: 'bike'}); },
  'moto': () => { const t = +Q.get('t'); navScreen({r: MALIO, along: T[t] - (+Q.get('d') || 450), mode: 'moto', speed: 8.9}); },
  'nogps': () => line(H*0.47, s('WaitingGps'), 'MEDIUM', '#dddddd'),
  'tostart': () => startArrow(1240, -38, 40),
  'atstart': () => startArrow(9, 0, 40),
  'loading': () => line(H*0.47, s('GettingRoute'), 'MEDIUM', '#dddddd'),
  'error-conn': () => errorScreen(['NoConnection', 'UseSaved', 'OrArrowToStart'], true),
  'error-full': () => errorScreen(['SlotsFull', 'DeleteOnPhone'], false),
  'picker': () => picker(['Loop Monas 10K', 'Malioboro Pagi', 'Pulang Kantor'], 1),
};
Promise.all(Object.values(VFONTS).map(F => new Promise(res => { F.img = new Image(); F.img.onload = res; F.img.src = F.src; })))
  .then(() => { SC[SCENE](); x.restore(); document.title = JSON.stringify(LOG); window.LOG = LOG; });
